<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The World Is a Recording</title>
<meta name="description" content="A first-person game about manipulating the physical history of a world.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23e8c88a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff6a4a'/%3E%3C/svg%3E">
<style>html,body{margin:0;height:100%;background:#050608;color:#c9c3b4;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace}#boot{max-width:560px;margin:18vh auto 0;padding:0 24px}#boot b{color:#e8c88a}#boot code{color:#e8c88a}</style>
<link rel="stylesheet" href="/src/ui/styles.css">
</head>
<body>
<div id="boot"><b>THE WORLD IS A RECORDING</b><br><span id="boot-msg">Loading…</span></div>
<noscript><div id="boot">This game needs JavaScript and WebGL 2.</div></noscript>
<script>
// Before the game script: explain a page that cannot run, and recover from a stale cached page whose script files
// were replaced by a newer deploy (reload once with a cache-buster).
(function () {
  var msg = function (h) { var m = document.getElementById('boot-msg'); if (m) m.innerHTML = h; };
  if (location.protocol === 'file:') msg('Browsers block games opened straight from disk. Serve it over http: <code>npm run build &amp;&amp; npm run preview</code>, or host the <code>dist/</code> folder.');
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK') || location.protocol === 'file:') return;
    try { if (!sessionStorage.getItem('twiar.reloaded')) { sessionStorage.setItem('twiar.reloaded', '1'); location.replace(location.pathname + '?v=' + Date.now()); return; } } catch (_) {}
    msg('The game files did not load. <a href="' + location.pathname + '?v=' + Date.now() + '" style="color:#e8c88a">Reload</a>');
  }, true);
  setTimeout(function () { if (document.getElementById('boot-msg')) msg('Still loading… If nothing happens, <a href="' + location.pathname + '?v=' + Date.now() + '" style="color:#e8c88a">reload</a>. The game needs a browser with JavaScript and WebGL 2.'); }, 15000);
})();
</script>
<div id="app">
  <canvas id="view" tabindex="0"></canvas>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
